name: SQL assistant UI
on:
  push:
    paths:
      - mainapp.py
      - requirements.txt
      - tests/test_sales_ui.py
      - .github/workflows/sales-ui.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sales-question:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UI_TEST_DB_PASSWORD: local-ci-fixture
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ui_test
          POSTGRES_PASSWORD: local-ci-fixture
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_sales_ui.py -v
